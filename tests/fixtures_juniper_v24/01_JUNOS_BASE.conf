/* Jeu de test 6NLG synthetique - adresses de documentation. */
system {
    host-name JN-BASE-01;
    services {
        ssh;
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 192.0.2.1/30;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 192.168.10.1/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.1/32;
            }
        }
    }
}
routing-options {
    router-id 10.255.0.1;
    static {
        route 0.0.0.0/0 {
            next-hop 192.0.2.2;
        }
    }
}
