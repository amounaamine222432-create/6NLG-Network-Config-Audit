/* Jeu de test 6NLG : routeur de laboratoire multi-fonctions (non deploye). */
system {
    host-name JN-CORE-04;
    services {
        ssh;
    }
}
interfaces {
    xe-0/0/0 {
        unit 0 {
            family inet {
                address 198.51.100.10/30;
            }
        }
    }
    xe-0/0/1 {
        unit 0 {
            family inet {
                address 10.44.0.1/30;
            }
            family mpls;
        }
    }
    ge-0/0/2 {
        unit 0 {
            family inet {
                address 192.168.44.1/24;
            }
        }
    }
    ge-0/0/3 {
        unit 0 {
            family inet {
                address 172.16.44.1/30;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.4.1/32;
            }
        }
    }
}
routing-options {
    router-id 10.255.4.1;
    autonomous-system 64520;
    static {
        route 0.0.0.0/0 {
            next-hop 198.51.100.9;
        }
    }
}
policy-options {
    prefix-list LAB-PREFIXES {
        192.168.44.0/24;
    }
    policy-statement EXPORT-LAB {
        term LOCAL-PREFIXES {
            from {
                prefix-list LAB-PREFIXES;
            }
            then accept;
        }
        term ELSE {
            then reject;
        }
    }
    policy-statement IMPORT-DEFAULT {
        term DEFAULT {
            from {
                route-filter 0.0.0.0/0 exact;
            }
            then accept;
        }
        term ELSE {
            then reject;
        }
    }
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface xe-0/0/1.0;
            interface lo0.0 {
                passive;
            }
        }
    }
    bgp {
        group EBGP-UPLINK {
            type external;
            peer-as 64521;
            local-address 198.51.100.10;
            family inet {
                unicast;
            }
            import IMPORT-DEFAULT;
            export EXPORT-LAB;
            neighbor 198.51.100.9;
        }
    }
    mpls {
        interface xe-0/0/1.0;
    }
    ldp {
        interface xe-0/0/1.0;
    }
    lldp {
        interface all;
    }
}
routing-instances {
    CLIENT-BLUE {
        instance-type virtual-router;
        interface ge-0/0/3.0;
        routing-options {
            static {
                route 172.16.45.0/24 {
                    next-hop 172.16.44.2;
                }
            }
        }
    }
}
