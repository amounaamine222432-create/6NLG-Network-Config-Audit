/* Jeu de test 6NLG : IGP OSPF et peering externe BGP simules. */
system {
    host-name JN-ROUTING-03;
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 203.0.113.2/30;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 10.30.0.1/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.3.1/32;
            }
        }
    }
}
routing-options {
    router-id 10.255.3.1;
    autonomous-system 64512;
}
policy-options {
    policy-statement IMPORT-ISP {
        term DOC-NETWORK {
            from {
                route-filter 203.0.113.0/24 exact;
            }
            then accept;
        }
        term DEFAULT-REJECT {
            then reject;
        }
    }
    policy-statement EXPORT-LAN {
        term CONNECTED {
            from {
                protocol direct;
            }
            then accept;
        }
        term REJECT-REST {
            then reject;
        }
    }
}
protocols {
    ospf {
        reference-bandwidth 10g;
        area 0.0.0.0 {
            interface ge-0/0/1.0;
            interface lo0.0 {
                passive;
            }
        }
    }
    bgp {
        group TRANSIT-ISP {
            type external;
            peer-as 64513;
            local-address 203.0.113.2;
            family inet {
                unicast;
            }
            import IMPORT-ISP;
            export EXPORT-LAN;
            neighbor 203.0.113.1;
        }
    }
}
