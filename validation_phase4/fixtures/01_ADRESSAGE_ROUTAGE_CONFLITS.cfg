version 15.2
hostname R-6NLG-ROUTES
no ip source-route
ip ssh version 2
!
interface GigabitEthernet0/0
 description WAN-LAB
 ip address 198.51.100.2 255.255.255.252
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/1
 description LAN-ONE
 ip address 10.20.10.1 255.255.255.0
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/2
 description LAN-OVERLAP-INTENTIONAL-ERROR
 ip address 10.20.10.129 255.255.255.128
 no ip proxy-arp
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 198.51.100.1
ip route 0.0.0.0 0.0.0.0 203.0.113.254
ip route 172.20.0.0 255.255.0.0 192.0.2.254
line vty 0 4
 transport input ssh
 login local
end
