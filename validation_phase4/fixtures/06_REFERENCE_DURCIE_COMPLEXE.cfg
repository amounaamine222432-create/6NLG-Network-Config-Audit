version 15.2
hostname R-6NLG-REFERENCE
no ip source-route
ip ssh version 2
aaa new-model
aaa authentication login default local
aaa authentication enable default enable
username labadmin privilege 15 secret 5 $1$LAB$NOT-A-REAL-HASH
enable secret 5 $1$LAB$NOT-A-REAL-HASH
ip access-list standard MGMT-LIMITED
 permit host 192.0.2.10
 deny any
ip access-list extended WAN-IN
 deny ip 10.0.0.0 0.255.255.255 any
 deny ip 172.16.0.0 0.15.255.255 any
 deny ip 192.168.0.0 0.0.255.255 any
 permit tcp any host 198.51.100.22 eq 443
 deny ip any any
vlan 100
 name USERS
vlan 200
 name SERVERS
ip dhcp pool USERS
 network 10.70.0.0 255.255.255.0
 default-router 10.70.0.1
ip dhcp pool SERVERS
 network 10.71.0.0 255.255.255.0
 default-router 10.71.0.1
!
interface GigabitEthernet0/0
 description WAN
 ip address 198.51.100.22 255.255.255.252
 ip access-group WAN-IN in
 ip nat outside
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/1
 description USERS
 ip address 10.70.0.1 255.255.255.0
 ip nat inside
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/2
 description SERVERS
 ip address 10.71.0.1 255.255.255.0
 no ip proxy-arp
 no shutdown
!
interface Loopback0
 ip address 10.255.70.1 255.255.255.255
!
router ospf 70
 router-id 10.255.70.1
 network 10.70.0.0 0.0.0.255 area 0
 network 10.71.0.0 0.0.0.255 area 0
!
router bgp 65070
 bgp router-id 10.255.70.1
 neighbor 198.51.100.21 remote-as 65071
 neighbor 198.51.100.21 password 7 DEMOONLY
!
ip route 0.0.0.0 0.0.0.0 198.51.100.21
logging buffered 16384 informational
logging trap informational
logging host 192.0.2.25
logging source-interface Loopback0
banner exec ^CLaboratoire 6NLG^C
line con 0
 exec-timeout 10 0
 login authentication default
line vty 0 4
 access-class MGMT-LIMITED in
 exec-timeout 10 0
 transport input ssh
 login authentication default
end
