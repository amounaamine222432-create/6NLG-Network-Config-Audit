version 15.2
hostname R-6NLG-OSPF-BGP
no ip source-route
ip ssh version 2
!
interface GigabitEthernet0/0
 description TRANSIT
 ip address 198.51.100.10 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description OSPF-NO-MD5-KEY
 ip address 10.40.0.1 255.255.255.0
 ip ospf authentication message-digest
 no shutdown
!
interface Loopback0
 ip address 10.255.40.1 255.255.255.255
!
router ospf 40
 router-id 10.255.40.1
 area 0 authentication message-digest
 network 10.40.0.0 0.0.0.255 area 0
 network 10.255.40.1 0.0.0.0 area 10
!
router bgp 65040
 bgp router-id 10.255.40.1
 neighbor 192.0.2.40 remote-as 65041
 neighbor 192.0.2.41 remote-as 65040
 network 10.40.0.0 mask 255.255.255.0
!
ip route 0.0.0.0 0.0.0.0 198.51.100.9
line vty 0 4
 transport input ssh
 login local
end
