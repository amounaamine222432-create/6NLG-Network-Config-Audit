version 15.2
hostname R-6NLG-VLAN-NAT-DHCP
no ip source-route
ip ssh version 2
vlan 100
 name USERS
vlan 200
 name SERVERS
ip dhcp excluded-address 10.50.0.1 10.50.0.20
ip dhcp pool USERS
 network 10.50.0.0 255.255.255.0
 default-router 10.50.0.1
ip dhcp pool USERS-OVERLAP
 network 10.50.0.0 255.255.255.128
 default-router 10.50.0.254
!
ip nat inside source static 10.50.0.10 203.0.113.10
ip nat inside source static 10.50.0.11 203.0.113.10
!
interface GigabitEthernet0/0
 description WAN
 ip address 198.51.100.18 255.255.255.252
 ip nat outside
 no shutdown
!
interface GigabitEthernet0/1
 description USER-LAN
 ip address 10.50.0.1 255.255.255.0
 ip nat inside
 no shutdown
!
interface GigabitEthernet0/2
 description ACCESS-UNDECLARED-VLAN
 switchport mode access
 switchport access vlan 999
 no shutdown
!
interface GigabitEthernet0/3
 description TRUNK-CHECK
 switchport mode trunk
 switchport trunk allowed vlan 100,200,999
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 198.51.100.17
line vty 0 4
 transport input ssh
 login local
end
