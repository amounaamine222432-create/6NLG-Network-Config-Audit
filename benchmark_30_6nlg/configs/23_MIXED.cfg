version 15.2
hostname R-BENCH-MIXED-23
no ip source-route
aaa new-model
aaa authentication login default local
ip ssh version 2
!
interface GigabitEthernet0/0
 description WAN
 ip address 198.51.100.93 255.255.255.252
 ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/1
 description LAN
 ip address 10.23.0.1 255.255.255.0
 no ip proxy-arp
 no shutdown
ip route 0.0.0.0 0.0.0.0 198.51.100.94
banner motd ^CAccess restricted^C
line con 0
 exec-timeout 5 0
 login authentication default
line vty 0 4
 exec-timeout 15 0
 transport input ssh
 login authentication default
line vty 5 15
 exec-timeout 15 0
 transport input ssh
 login authentication default
snmp-server community labreadonly RO
logging buffered 8192 informational
logging host 192.0.2.20
ntp server 192.0.2.30
end
