version 15.2
hostname R-CIS39-BRANCH-SECURE
no ip source-route
no ip http server
no ip http secure-server
aaa new-model
aaa authentication login default local
aaa authentication enable default enable
username auditadmin privilege 15 secret 5 $1$LAB$PLACEHOLDER
enable secret 5 $1$LAB$PLACEHOLDER
ip ssh version 2
ip access-list standard VTY-MGMT
 permit host 10.60.10.100
 deny any log
ip access-list extended WAN-IN
 deny ip 0.0.0.0 0.255.255.255 any log
 deny ip 10.0.0.0 0.255.255.255 any log
 deny ip 127.0.0.0 0.255.255.255 any log
 deny ip 169.254.0.0 0.0.255.255 any log
 deny ip 172.16.0.0 0.15.255.255 any log
 deny ip 192.0.2.0 0.0.0.255 any log
 deny ip 192.168.0.0 0.0.255.255 any log
 deny ip 224.0.0.0 31.255.255.255 any log
 deny ip host 255.255.255.255 any log
 permit tcp any host 198.51.100.2 eq 443
ip prefix-list LAN-PREFIX seq 5 permit 10.60.0.0/16
route-map EXPORT-LAN permit 10
 match ip address prefix-list LAN-PREFIX
vrf definition CUSTOMER-A
 rd 65000:60
vlan 160
 name CUSTOMER-A
ip dhcp excluded-address 10.60.10.1 10.60.10.20
ip dhcp pool LAN-CLIENTS
 network 10.60.10.0 255.255.255.0
 default-router 10.60.10.1
 dns-server 192.0.2.53
ip nat inside source static 10.60.10.10 203.0.113.10
!
interface GigabitEthernet0/0
 description WAN
 ip address 198.51.100.2 255.255.255.252
 ip access-group WAN-IN in
 ip nat outside
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/1
 description LAN
 ip address 10.60.10.1 255.255.255.0
 ip nat inside
 no ip proxy-arp
 ip authentication mode eigrp 60 md5
 ip authentication key-chain eigrp 60 EIGRP-KEYS
 ip ospf message-digest-key 1 md5 LABPLACEHOLDER
 no shutdown
!
interface GigabitEthernet0/2
 description CUSTOMER-VRF
 vrf forwarding CUSTOMER-A
 no ip proxy-arp
 no shutdown
!
interface Loopback0
 description NTP-SOURCE
 ip address 172.31.255.1 255.255.255.255
 no ip proxy-arp
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 198.51.100.1
router ospf 60
 router-id 10.60.0.1
 area 0 authentication message-digest
 network 10.60.10.0 0.0.0.255 area 0
 passive-interface GigabitEthernet0/1
router eigrp 60
 network 10.60.0.0 0.0.255.255
 no auto-summary
key chain EIGRP-KEYS
 key 1
  key-string LABPLACEHOLDER
router bgp 65060
 bgp router-id 10.60.0.1
 neighbor 192.0.2.60 remote-as 65160
 neighbor 192.0.2.60 password LAB-PLACEHOLDER-ONLY
 network 10.60.0.0 mask 255.255.0.0
logging buffered 64000 informational
logging trap informational
logging source-interface GigabitEthernet0/1
logging host 192.0.2.20
ntp authenticate
ntp authentication-key 1 md5 LAB-PLACEHOLDER-ONLY
ntp authentication-key 2 md5 LAB-SECOND-PLACEHOLDER
ntp trusted-key 1
ntp trusted-key 2
ntp source Loopback0
ntp server 192.0.2.30 key 1
ntp server 192.0.2.31 key 2
snmp-server group MONITOR v3 priv
banner motd ^CAuthorized administrators only^C
banner login ^CRestricted access^C
banner exec ^CSecurity audit lab^C
line con 0
 exec-timeout 5 0
 login authentication default
line vty 0 4
 access-class VTY-MGMT in
 exec-timeout 5 0
 transport input ssh
 login authentication default
line vty 5 15
 access-class VTY-MGMT in
 exec-timeout 5 0
 transport input ssh
 login authentication default
end
