# Exemple synthétique JUNOS display set pour la validation IR v2.2.
# Adresses réservées à la documentation (RFC 5737).
set system host-name SRX-LAB-EDGE
set interfaces ge-0/0/0 unit 0 family inet address 192.0.2.1/30
set interfaces ge-0/0/1 unit 0 family inet address 10.10.10.1/24
set routing-options router-id 192.0.2.1
set routing-options autonomous-system 64512
set routing-options static route 0.0.0.0/0 next-hop 192.0.2.2
set protocols bgp group UPSTREAM type external
set protocols bgp group UPSTREAM peer-as 64513
set protocols bgp group UPSTREAM hold-time 90
set protocols bgp group UPSTREAM multipath
set protocols bgp group UPSTREAM neighbor 192.0.2.2 peer-as 64513
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0 metric 10
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0 hello-interval 10
set routing-instances TENANT-A instance-type vrf
set routing-instances TENANT-A interface ge-0/0/1.0
set routing-instances TENANT-A vrf-target target:64512:100
set security zones security-zone TRUST interfaces ge-0/0/1.0
set security zones security-zone TRUST host-inbound-traffic system-services ssh
set security zones security-zone INTERNET interfaces ge-0/0/0.0
set security policies from-zone TRUST to-zone INTERNET policy ALLOW-WEB match source-address any
set security policies from-zone TRUST to-zone INTERNET policy ALLOW-WEB match destination-address any
set security policies from-zone TRUST to-zone INTERNET policy ALLOW-WEB match application any
set security policies from-zone TRUST to-zone INTERNET policy ALLOW-WEB then permit
set security nat source rule-set PAT-OUT from zone TRUST
set security nat source rule-set PAT-OUT to zone INTERNET
set security nat source rule-set PAT-OUT rule PAT match source-address 10.10.10.0/24
set security nat source rule-set PAT-OUT rule PAT then source-nat interface
set security screen ids-option INTERNET-SCREEN icmp ping-death
set security screen ids-option INTERNET-SCREEN tcp syn-flood alarm-threshold 1024
