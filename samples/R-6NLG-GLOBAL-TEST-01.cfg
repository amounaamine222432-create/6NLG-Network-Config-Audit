!
! SUP'COM / 6NLG - Cas de test global pour NetAudit (Cisco IOS classique)
! Configuration synthetique multi-fonctionnalites : A NE PAS DEPLOYER.
! Les adresses Internet sont issues des plages de documentation RFC 5737.
! DEMO_ONLY_REDACTED est un marqueur de test, pas un vrai secret SNMP.
!
version 15.9
hostname R-6NLG-GLOBAL-TEST-01
no ip domain lookup
ip domain name 6nlg.example.invalid
ip ssh version 2
username AUDIT_TEST privilege 15 secret 0 DEMO_ONLY_NOT_A_REAL_SECRET
no ip http server
service timestamps log datetime msec
clock timezone CET 1 0
!
vrf definition MGMT
 description ROUTAGE_DE_GESTION
 rd 65010:99
 address-family ipv4
 exit-address-family
!
interface Loopback0
 description ROUTER_ID_OSPF_BGP
 ip address 10.255.255.1 255.255.255.255
!
interface GigabitEthernet0/0
 description TRUNK_VERS_SWITCH_LAN
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 description VLAN10_UTILISATEURS
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 ip access-group ACL_USERS_IN in
 ip nat inside
 standby version 2
 standby 10 ip 10.10.10.254
 standby 10 priority 110
 standby 10 preempt
 no shutdown
!
interface GigabitEthernet0/0.20
 description VLAN20_SERVEURS
 encapsulation dot1Q 20
 ip address 10.20.20.1 255.255.255.0
 ip nat inside
 ip helper-address 192.0.2.15
 no shutdown
!
interface GigabitEthernet0/1
 description LIEN_WAN_OPERATEUR_TEST
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 no shutdown
!
interface GigabitEthernet0/2
 description TRANSIT_OSPF_INTERNE
 ip address 10.0.12.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description ACCES_GESTION_ISOLE
 vrf forwarding MGMT
 ip address 192.0.2.2 255.255.255.0
 no shutdown
!
interface GigabitEthernet1/0
 description SWITCHPORT_TRUNK_DEMO
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
 no shutdown
!
vlan 10
 name USERS
!
vlan 20
 name SERVERS
!
vlan 99
 name MANAGEMENT
!
ip access-list extended ACL_USERS_IN
 permit tcp 10.10.10.0 0.0.0.255 10.20.20.0 0.0.0.255 eq 443
 permit udp 10.10.10.0 0.0.0.255 any eq 53
 deny ip any any log
!
ip access-list standard NAT_INSIDE
 permit 10.10.10.0 0.0.0.255
 permit 10.20.20.0 0.0.0.255
!
ip dhcp excluded-address 10.10.10.1 10.10.10.20
ip dhcp pool DHCP_USERS
 network 10.10.10.0 255.255.255.0
 default-router 10.10.10.1
 dns-server 192.0.2.53
 lease 1
!
ip nat inside source list NAT_INSIDE interface GigabitEthernet0/1 overload
ip route 0.0.0.0 0.0.0.0 203.0.113.1
ip route vrf MGMT 0.0.0.0 0.0.0.0 192.0.2.1
!
router ospf 10
 router-id 10.255.255.1
 passive-interface default
 no passive-interface GigabitEthernet0/2
 network 10.0.12.0 0.0.0.3 area 0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.20.20.0 0.0.0.255 area 0
 network 10.255.255.1 0.0.0.0 area 0
!
router bgp 65010
 bgp router-id 10.255.255.1
 neighbor 203.0.113.1 remote-as 65020
 neighbor 203.0.113.1 description ISP_DEMO
 neighbor 203.0.113.1 route-map EXPORT_FILTER out
 network 10.10.10.0 mask 255.255.255.0
 network 10.20.20.0 mask 255.255.255.0
!
ip prefix-list PREFIXES_PUBLICABLE seq 5 permit 10.10.10.0/24
ip prefix-list PREFIXES_PUBLICABLE seq 10 permit 10.20.20.0/24
!
route-map EXPORT_FILTER permit 10
 match ip address prefix-list PREFIXES_PUBLICABLE
 set as-path prepend 65010 65010
!
snmp-server community DEMO_ONLY_REDACTED RO
snmp-server location LAB_6NLG
snmp-server contact noc@example.invalid
snmp-server group NOC v3 auth
snmp-server user MONITORING NOC v3 auth sha DEMO_ONLY_AUTH_KEY
snmp-server enable traps snmp authentication
logging buffered 32768 informational
logging host 192.0.2.99
ntp server 192.0.2.123
!
line vty 0 4
 transport input ssh
 login local
!
end
