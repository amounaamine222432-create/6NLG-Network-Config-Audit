!
! SUP'COM 6NLG - Independent Cisco IOS parser test fixture
! Synthetic lab-only configuration; never apply directly to production.
! SNMPv2c appears solely to exercise the parser.
!
version 15.2
service timestamps log datetime msec
hostname LAB-AUDIT-R1
!
no ip domain lookup
ip domain name lab.invalid
!
interface Loopback0
 description OSPF router ID and management source
 ip address 10.255.0.1 255.255.255.255
!
interface GigabitEthernet0/0
 description INTERNAL_LAN
 ip address 192.168.10.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description OSPF_UPLINK_TO_R2
 ip address 10.0.12.1 255.255.255.252
 no shutdown
!
router ospf 10
 router-id 10.255.0.1
 passive-interface Loopback0
 passive-interface GigabitEthernet0/0
 network 10.255.0.1 0.0.0.0 area 0
 network 192.168.10.0 0.0.0.255 area 0
 network 10.0.12.0 0.0.0.3 area 0
!
ip route 172.16.20.0 255.255.255.0 10.0.12.2 150
ip route 0.0.0.0 0.0.0.0 10.0.12.2
!
access-list 20 permit 192.0.2.50
!
snmp-server community LAB_MONITOR_RO RO 20
snmp-server host 192.0.2.50 version 2c LAB_MONITOR_RO
snmp-server location SUPCOM-LAB
snmp-server contact netadmin@example.invalid
snmp-server enable traps
!
logging host 192.0.2.60
logging source-interface Loopback0
logging trap warnings
!
end
