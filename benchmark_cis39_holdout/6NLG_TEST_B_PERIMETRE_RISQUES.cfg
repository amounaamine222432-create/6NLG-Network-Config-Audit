version 15.2
hostname R-6NLG-HOLDOUT-RISKS
ip source-route
aaa new-model
aaa authentication login default local
aaa authentication enable default enable
username labadmin privilege 15 password 7 DEMOONLY
enable secret 5 $1$DEMO$NOTAREALSECRET
ip ssh version 1
ip access-list standard MGMT-BROAD
 permit any
ip access-list extended EDGE-WEAK
 permit ip any any
 deny ip 10.0.0.0 0.255.255.255 any
 deny ip 192.168.0.0 0.0.255.255 any
ip access-list extended ACL-ORPHAN
 permit tcp any any eq 80
 deny ip any any
ip prefix-list REMOTE-NETS seq 5 permit 10.88.0.0/16
route-map EXPORT-REMOTE permit 10
 match ip address prefix-list REMOTE-NETS
vrf definition CUSTOMER-RISK
 rd 65088:88
vlan 188
 name REMOTE-LAN
ip dhcp excluded-address 10.88.50.1 10.88.50.10
ip dhcp pool REMOTE-LAN
 network 10.88.50.0 255.255.255.0
 default-router 10.88.50.1
 dns-server 192.0.2.53
ip nat inside source static 10.88.50.25 203.0.113.55
!
interface GigabitEthernet0/0
 description EDGE-WAN
 ip address 198.51.100.14 255.255.255.252
 ip access-group EDGE-WEAK in
 ip nat outside
 ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/1
 description LAN
 ip address 10.88.50.1 255.255.255.0
 ip nat inside
 ip proxy-arp
 ip authentication mode eigrp 88 md5
 ip ospf message-digest-key 1 md5 DEMO-ONLY
 no shutdown
!
interface Loopback0
 ip address 172.31.88.1 255.255.255.255
 no ip proxy-arp
!
interface Tunnel8
 description OPTIONAL-UNREVIEWED-TUNNEL
 ip address 10.88.88.1 255.255.255.252
!
ip route 0.0.0.0 0.0.0.0 198.51.100.13
ip route 0.0.0.0 0.0.0.0 203.0.113.254
router ospf 88
 router-id 10.88.0.1
 area 0 authentication message-digest
 network 10.88.50.0 0.0.0.255 area 0
router eigrp 88
 network 10.88.0.0 0.0.255.255
 no auto-summary
router bgp 65088
 bgp router-id 10.88.0.1
 neighbor 192.0.2.88 remote-as 65188
 network 10.88.0.0 mask 255.255.0.0
logging buffered 4096 informational
logging trap warnings
logging source-interface GigabitEthernet0/1
logging host 192.0.2.22
ntp authenticate
ntp authentication-key 8 md5 DEMO-ONLY
ntp trusted-key 8
ntp source Loopback0
ntp server 192.0.2.32 key 9
snmp-server community DEMO-ONLY RW
snmp-server group AUDIT-READERS v3 auth
banner motd ^CRemote laboratory^C
banner login ^CAuthorized users only^C
banner exec ^CNetwork laboratory^C
line con 0
 exec-timeout 0 0
 login authentication default
line vty 0 4
 access-class MGMT-BROAD in
 exec-timeout 15 0
 transport input telnet ssh
 login authentication default
line vty 5 15
 access-class MGMT-BROAD in
 exec-timeout 15 0
 transport input ssh
 login authentication default
end
