version 15.2
hostname R-6NLG-HOLDOUT-SECURE
no ip source-route
no ip http server
no ip http secure-server
aaa new-model
aaa authentication login default local
aaa authentication enable default enable
username labadmin privilege 15 secret 5 $1$DEMO$NOTAREALSECRET
enable secret 5 $1$DEMO$NOTAREALSECRET
ip ssh version 2
ip access-list standard MGMT-IN
 permit host 10.77.50.10
 permit host 10.77.50.11
 deny any log
ip access-list extended EDGE-FILTER
 deny ip 0.0.0.0 0.255.255.255 any log
 deny ip 10.0.0.0 0.255.255.255 any log
 deny ip 127.0.0.0 0.255.255.255 any log
 deny ip 169.254.0.0 0.0.255.255 any log
 deny ip 172.16.0.0 0.15.255.255 any log
 deny ip 192.0.2.0 0.0.0.255 any log
 deny ip 192.168.0.0 0.0.255.255 any log
 deny ip host 255.255.255.255 any log
 deny ip 224.0.0.0 31.255.255.255 any log
 permit tcp any host 198.51.100.10 eq 443
ip prefix-list BRANCH-NETS seq 5 permit 10.77.0.0/16
route-map EXPORT-BRANCH permit 10
 match ip address prefix-list BRANCH-NETS
vrf definition BRANCH-CUSTOMER
 rd 65077:77
vlan 177
 name BRANCH-USERS
ip dhcp excluded-address 10.77.50.1 10.77.50.20
ip dhcp pool BRANCH-LAN
 network 10.77.50.0 255.255.255.0
 default-router 10.77.50.1
 dns-server 192.0.2.53
ip nat inside source static 10.77.50.25 203.0.113.25
!
interface GigabitEthernet0/0
 description WAN-EDGE
 ip address 198.51.100.10 255.255.255.252
 ip access-group EDGE-FILTER in
 ip nat outside
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/1
 description BRANCH-LAN
 ip address 10.77.50.1 255.255.255.0
 ip nat inside
 no ip proxy-arp
 ip authentication mode eigrp 77 md5
 ip authentication key-chain eigrp 77 BRANCH-EIGRP
 ip ospf message-digest-key 7 md5 DEMO-ONLY
 no shutdown
!
interface GigabitEthernet0/2
 description CUSTOMER-VRF
 vrf forwarding BRANCH-CUSTOMER
 no ip proxy-arp
 no shutdown
!
interface Loopback0
 ip address 172.31.77.1 255.255.255.255
 no ip proxy-arp
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 198.51.100.9
router ospf 77
 router-id 10.77.0.1
 area 0 authentication message-digest
 network 10.77.50.0 0.0.0.255 area 0
 passive-interface GigabitEthernet0/1
router eigrp 77
 network 10.77.0.0 0.0.255.255
 no auto-summary
key chain BRANCH-EIGRP
 key 7
  key-string DEMO-ONLY
router bgp 65077
 bgp router-id 10.77.0.1
 neighbor 192.0.2.77 remote-as 65177
 neighbor 192.0.2.77 password DEMO-ONLY
 network 10.77.0.0 mask 255.255.0.0
logging buffered 64000 informational
logging trap informational
logging source-interface GigabitEthernet0/1
logging host 192.0.2.21
ntp authenticate
ntp authentication-key 7 md5 DEMO-ONLY
ntp trusted-key 7
ntp source Loopback0
ntp server 192.0.2.31 key 7
snmp-server group AUDIT-READERS v3 priv
banner motd ^CBranch security notice^C
banner login ^CAuthorized personnel only^C
banner exec ^CAudit laboratory^C
line con 0
 exec-timeout 4 0
 login authentication default
line vty 0 4
 access-class MGMT-IN in
 exec-timeout 4 0
 transport input ssh
 login authentication default
line vty 5 15
 access-class MGMT-IN in
 exec-timeout 4 0
 transport input ssh
 login authentication default
end
