version 15.2
hostname R-FINAL-MIXED-RISK
ip source-route
ip http server
no aaa new-model
enable password labonly
username admin privilege 15 password labonly
ip access-list extended WAN-OPEN
 permit ip any any log
ip access-list standard VTY-OPEN
 permit any
ip prefix-list OPEN-PREFIX seq 5 permit 10.70.0.0/16
route-map OPEN-EXPORT permit 10
 match ip address prefix-list OPEN-PREFIX
vrf definition CUSTOMER-B
 rd 65000:70
vlan 170
 name CUSTOMER-B
ip dhcp excluded-address 10.70.10.1 10.70.10.5
ip dhcp pool LAN-TEST
 network 10.70.10.0 255.255.255.0
 default-router 10.70.10.1
 dns-server 192.0.2.53
ip nat inside source static 10.70.10.10 203.0.113.20
!
interface GigabitEthernet0/0
 description WAN
 ip address 198.51.100.6 255.255.255.252
 ip access-group WAN-OPEN in
 ip nat outside
 ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/1
 description LAN
 ip address 10.70.10.1 255.255.255.0
 ip nat inside
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/2
 description CUSTOMER-VRF
 vrf forwarding CUSTOMER-B
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 198.51.100.5
router ospf 70
 router-id 10.70.0.1
 network 10.70.10.0 0.0.0.255 area 0
router eigrp 70
 network 10.70.0.0 0.0.255.255
 auto-summary
router bgp 65070
 bgp router-id 10.70.0.1
 neighbor 192.0.2.70 remote-as 65170
 network 10.70.0.0 mask 255.255.0.0
logging buffered 8192 informational
snmp-server community labpublic RO
snmp-server community labprivate RW
banner motd ^CTest system — access restricted^C
line con 0
 exec-timeout 0 0
 password labonly
 login
line vty 0 4
 access-class VTY-OPEN in
 exec-timeout 15 0
 transport input telnet
 password labonly
 login
line vty 5 15
 access-class VTY-OPEN in
 exec-timeout 0 0
 transport input all
 password labonly
 login
end
