!
! 6NLG - Configuration de test synthetique - OSPF, eBGP et filtrage
! Adresses de documentation RFC 5737. Ne pas deployer en production.
!
version 15.9
hostname R-LAB-OSPF-BGP
!
interface Loopback0
 description IDENTIFIANT_ROUTAGE
 ip address 10.255.10.1 255.255.255.255
!
interface Loopback1
 description PREFIXE_POUR_BGP
 ip address 198.51.100.1 255.255.255.0
!
interface GigabitEthernet0/0
 description VERS_RESEAU_OSPF
 ip address 10.10.10.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description VERS_AS_EXTERNE
 ip address 203.0.113.1 255.255.255.252
 no shutdown
!
router ospf 110
 router-id 10.255.10.1
 passive-interface default
 no passive-interface GigabitEthernet0/0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.255.10.1 0.0.0.0 area 0
!
router bgp 65010
 bgp router-id 10.255.10.1
 neighbor 203.0.113.2 remote-as 65020
 neighbor 203.0.113.2 description FOURNISSEUR_TEST
 neighbor 203.0.113.2 route-map EXPORT_FILTER out
 network 198.51.100.0 mask 255.255.255.0
!
ip prefix-list PL_EXPORT seq 5 permit 198.51.100.0/24
!
route-map EXPORT_FILTER permit 10
 match ip address prefix-list PL_EXPORT
 set as-path prepend 65010 65010
!
logging host 192.0.2.200
!
end
