!
! 6NLG - Configuration de test synthetique - VLAN et ACL
! Adresses de documentation RFC 5737. Ne pas deployer en production.
!
version 15.9
hostname R-LAB-VLAN-ACL
no ip domain-lookup
!
interface GigabitEthernet0/0
 description TRUNK_VERS_SWITCH
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 description VLAN_10_UTILISATEURS
 encapsulation dot1Q 10
 ip address 192.0.2.1 255.255.255.0
 ip access-group USERS_IN in
!
interface GigabitEthernet0/0.20
 description VLAN_20_SERVEURS
 encapsulation dot1Q 20
 ip address 198.51.100.1 255.255.255.0
!
interface GigabitEthernet0/1
 description LIEN_VERS_AMONT
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
ip access-list extended USERS_IN
 permit tcp 192.0.2.0 0.0.0.255 198.51.100.0 0.0.0.255 eq 443
 permit udp 192.0.2.0 0.0.0.255 any eq 53
 deny ip any any log
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
logging buffered 16384 warnings
logging host 203.0.113.10
!
line vty 0 4
 transport input ssh
!
end
