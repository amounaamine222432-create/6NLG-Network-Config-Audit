!
! 6NLG - Configuration de test synthetique - DHCP, NAT/PAT et SSH
! Aucun identifiant ni secret de connexion n'est fourni.
! Ne pas deployer en production sans parametrage de securite.
!
version 15.9
hostname R-LAB-DHCP-NAT-SSH
no ip domain-lookup
ip domain-name lab.example
ip ssh version 2
!
interface GigabitEthernet0/0
 description LAN_UTILISATEURS
 ip address 10.30.0.1 255.255.255.0
 ip nat inside
 no shutdown
!
interface GigabitEthernet0/1
 description VERS_OPERATEUR_TEST
 ip address 203.0.113.5 255.255.255.252
 ip nat outside
 no shutdown
!
ip dhcp excluded-address 10.30.0.1 10.30.0.20
!
ip dhcp pool DHCP_USERS
 network 10.30.0.0 255.255.255.0
 default-router 10.30.0.1
 dns-server 192.0.2.53
 lease 1
!
ip access-list standard NAT_INSIDE
 permit 10.30.0.0 0.0.0.255
!
ip nat inside source list NAT_INSIDE interface GigabitEthernet0/1 overload
ip route 0.0.0.0 0.0.0.0 203.0.113.6
logging buffered 64000 informational
logging host 192.0.2.99
!
line vty 0 4
 transport input ssh
!
end
