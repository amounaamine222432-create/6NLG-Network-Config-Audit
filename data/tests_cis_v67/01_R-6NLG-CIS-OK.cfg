version 15.2
hostname R-6NLG-CIS-OK
no ip source-route
no ip http server
no ip http secure-server
aaa new-model
aaa authentication login default local
aaa authentication enable default enable
username auditadmin privilege 15 secret 5 $1$LAB$PLACEHOLDER
enable secret 5 $1$LAB$PLACEHOLDER
ip ssh version 2
ip access-list standard VTY-MGMT
 permit 192.0.2.10
 deny any log
!
interface GigabitEthernet0/0
 description WAN
 ip address 198.51.100.2 255.255.255.252
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/1
 description LAN
 ip address 10.30.0.1 255.255.255.0
 no ip proxy-arp
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 198.51.100.1
logging buffered 16384 informational
logging trap informational
logging source-interface GigabitEthernet0/1
logging host 192.0.2.20
ntp server 192.0.2.30
snmp-server group MONITOR v3 priv
banner motd ^CAcces reserve aux personnes autorisees^C
banner login ^CConnexion surveillee^C
banner exec ^CAdministration reservee^C
line con 0
 exec-timeout 5 0
 login authentication default
line vty 0 4
 access-class VTY-MGMT in
 exec-timeout 5 0
 transport input ssh
 login authentication default
line vty 5 15
 access-class VTY-MGMT in
 exec-timeout 5 0
 transport input ssh
 login authentication default
end
