version 15.2
hostname R-6NLG-CIS-MIXED
no ip source-route
aaa new-model
aaa authentication login default local
username operator privilege 15 secret 5 $1$LAB$PLACEHOLDER
enable secret 5 $1$LAB$PLACEHOLDER
ip ssh version 2
!
interface GigabitEthernet0/0
 description WAN
 ip address 203.0.113.2 255.255.255.252
 ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/1
 description LAN
 ip address 172.16.10.1 255.255.255.0
 no ip proxy-arp
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
logging buffered 8192 informational
ntp server 192.0.2.30
snmp-server community labpublic RO
banner motd ^CAcces reserve^C
line con 0
 exec-timeout 5 0
 login authentication default
line vty 0 4
 exec-timeout 5 0
 transport input ssh
 login authentication default
line vty 5 15
 exec-timeout 15 0
 transport input ssh
 login authentication default
end
