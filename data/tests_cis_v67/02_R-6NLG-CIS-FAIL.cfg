version 15.2
hostname R-6NLG-CIS-FAIL
ip source-route
ip http server
no aaa new-model
enable password labpassword
username admin privilege 15 password labpassword
!
interface GigabitEthernet0/0
 description WAN
 ip address 198.51.100.6 255.255.255.252
 ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/1
 description LAN
 ip address 10.40.0.1 255.255.255.0
 ip proxy-arp
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 198.51.100.5
snmp-server community labpublic RO
snmp-server community labprivate RW
line con 0
 exec-timeout 0 0
 password labpassword
 login
line vty 0 4
 exec-timeout 0 0
 password labpassword
 transport input telnet
 login
line vty 5 15
 exec-timeout 0 0
 password labpassword
 transport input all
 login
end
