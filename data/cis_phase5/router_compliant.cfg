! DEMONSTRATION UNIQUEMENT : adresses TEST-NET, secrets fictifs.
version 15.9
hostname R-PHASE5-OK
no ip source-route
no ip http server
ip http secure-server
ip ssh version 2
enable secret 9 LAB_ONLY_HASH
username audit privilege 15 secret 9 LAB_ONLY_HASH
aaa new-model
aaa authentication login default group radius local
aaa authentication enable default group radius enable
logging buffered 64000
logging trap informational
logging host 192.0.2.11
logging source-interface Loopback0
ntp authenticate
ntp authentication-key 1 md5 LAB_ONLY_NTP
ntp trusted-key 1
ntp server 192.0.2.12 key 1
ntp source Loopback0
snmp-server group AUDIT v3 priv
key chain LAB-EIGRP
 key 1
  key-string LAB_ONLY_EIGRP
!
interface Loopback0
 ip address 192.0.2.1 255.255.255.255
 no ip proxy-arp
!
interface GigabitEthernet0/0
 description EXTERNE TEST-NET
 ip address 198.51.100.1 255.255.255.252
 ip access-group WAN-IN in
 ip ospf message-digest-key 1 md5 LAB_ONLY_OSPF
 ip ospf authentication message-digest
 ip authentication key-chain eigrp 100 LAB-EIGRP
 ip authentication mode eigrp 100 md5
 no ip proxy-arp
 no shutdown
!
router ospf 1
 router-id 192.0.2.1
 network 198.51.100.0 0.0.0.3 area 0
 area 0 authentication message-digest
!
router eigrp 100
 network 198.51.100.0 0.0.0.3
!
ip access-list extended MGMT-VTY
 permit tcp host 192.0.2.5 any eq 22
 deny ip any any log
!
ip access-list extended WAN-IN
 deny ip 0.0.0.0 0.255.255.255 any log
 deny ip 10.0.0.0 0.255.255.255 any log
 deny ip 127.0.0.0 0.255.255.255 any log
 deny ip 169.254.0.0 0.0.255.255 any log
 deny ip 172.16.0.0 0.15.255.255 any log
 deny ip 192.0.2.0 0.0.0.255 any log
 deny ip 192.168.0.0 0.0.255.255 any log
 deny ip 224.0.0.0 31.255.255.255 any log
 deny ip host 255.255.255.255 any log
 permit ip any any log
!
line con 0
 login authentication default
 exec-timeout 5 0
!
line vty 0 4
 login authentication default
 transport input ssh
 exec-timeout 5 0
 access-class MGMT-VTY in
!
banner exec ^C
Acces reserve aux utilisateurs autorises.^C
banner login ^C
Connexion surveillee.^C
banner motd ^C
Autorisation requise.^C
end
