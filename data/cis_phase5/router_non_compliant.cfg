! DEMONSTRATION : erreurs volontaires. Ne pas charger sur un routeur reel.
version 15.9
hostname R-PHASE5-FAIL
ip source-route
ip http server
ip ssh version 1
enable password 7 LAB_ONLY_FAKE
username audit privilege 15 password 7 LAB_ONLY_FAKE
no aaa new-model
aaa authentication login default none
aaa authentication enable default none
logging buffered 4096
logging trap errors
snmp-server community LAB_ONLY_RW RW
interface Loopback0
 ip address 192.0.2.21 255.255.255.255
 ip proxy-arp
!
interface GigabitEthernet0/0
 description EXTERNE TEST-NET
 ip address 198.51.100.5 255.255.255.252
 ip access-group WAN-OPEN in
 ip ospf authentication null
 ip authentication mode eigrp 100 none
 ip proxy-arp
!
router ospf 1
 network 198.51.100.4 0.0.0.3 area 0
 area 0 authentication
!
router eigrp 100
 network 198.51.100.4 0.0.0.3
!
ip access-list extended MGMT-OPEN
 permit ip any any
!
ip access-list extended WAN-OPEN
 permit ip any any
!
line con 0
 no login
 exec-timeout 0 0
!
line vty 0 4
 login
 transport input telnet
 exec-timeout 0 0
 access-class MGMT-OPEN in
!
end
