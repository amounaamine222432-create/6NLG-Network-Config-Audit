!
! SUP'COM 6NLG -- Independent final router audit fixture
! Synthetic Cisco IOS lab configuration. NOT FOR PRODUCTION.
! Address blocks and credentials are fictional test data.
!
version 15.9
service timestamps log datetime msec
hostname R-AUDIT-EDGE-01
no ip domain lookup
ip domain name lab.invalid
ip cef
no ip http server
no ip http secure-server
ip ssh version 2
!
vrf definition MGMT
 description Out-of-band management
 rd 65010:99
 address-family ipv4
 exit-address-family
!
interface Loopback0
 description OSPF_BGP_ROUTER_ID
 ip address 10.255.255.1 255.255.255.255
!
interface GigabitEthernet0/0
 description INTERNAL_LAN_USERS
 ip address 192.168.50.2 255.255.255.0
 ip nat inside
 standby 50 ip 192.168.50.1
 standby 50 priority 110
 standby 50 preempt
 no shutdown
!
interface GigabitEthernet0/1
 description EBGP_UPLINK_ISP
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 no shutdown
!
interface GigabitEthernet0/2
 description INTERNAL_OSPF_TRANSIT
 ip address 10.0.12.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description OUT_OF_BAND_MANAGEMENT
 vrf forwarding MGMT
 ip address 172.31.255.2 255.255.255.0
 no shutdown
!
router ospf 10
 router-id 10.255.255.1
 passive-interface Loopback0
 passive-interface GigabitEthernet0/0
 network 10.255.255.1 0.0.0.0 area 0
 network 192.168.50.0 0.0.0.255 area 0
 network 10.0.12.0 0.0.0.3 area 0
!
router bgp 65010
 bgp router-id 10.255.255.1
 neighbor 203.0.113.1 remote-as 65020
 address-family ipv4
  network 192.168.50.0 mask 255.255.255.0
  neighbor 203.0.113.1 activate
  neighbor 203.0.113.1 route-map ISP_OUT out
 exit-address-family
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
ip route 198.51.100.0 255.255.255.0 10.0.12.2 200
!
ip prefix-list OUT_LAN seq 5 permit 192.168.50.0/24
route-map ISP_OUT permit 10
 match ip address prefix-list OUT_LAN
!
access-list 10 permit 192.168.50.0 0.0.0.255
access-list 20 permit host 192.0.2.50
ip access-list extended MGMT_FILTER
 10 permit tcp host 192.0.2.50 host 172.31.255.2 eq 22
 20 deny ip any any
!
ip nat inside source list 10 interface GigabitEthernet0/1 overload
!
ip dhcp excluded-address 192.168.50.1 192.168.50.30
ip dhcp pool USERS
 network 192.168.50.0 255.255.255.0
 default-router 192.168.50.1
 dns-server 192.0.2.53
 domain-name lab.invalid
!
snmp-server community LAB_RO_ONLY RO 20
snmp-server host 192.0.2.50 version 2c LAB_RO_ONLY
logging host 192.0.2.60
logging source-interface Loopback0
logging trap warnings
!
username auditor privilege 15 secret 5 FAKE_TEST_HASH_NEVER_USE
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
banner login ^CC
AUTHORIZED TEST LAB ONLY^C
!
end
