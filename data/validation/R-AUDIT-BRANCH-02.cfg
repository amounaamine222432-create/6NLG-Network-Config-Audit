!
! SUP'COM 6NLG - Deuxieme test independant du parseur Cisco IOS V6
! Configuration FICTIVE pour validation statique uniquement.
! Les adresses et identifiants sont des exemples de laboratoire.
!
enable
configure terminal
version 15.9
service timestamps log datetime msec
hostname R-AUDIT-BRANCH-02
no ip domain lookup
ip domain name lab.example.invalid
ip cef
no ip http server
ip http secure-server
ip ssh version 2
!
vrf definition ADMIN
 description Gestion hors bande
 rd 65120:20
 address-family ipv4
 exit-address-family
!
interface Loopback0
 description Identifiant OSPF et BGP
 ip address 10.20.20.20 255.255.255.255
!
interface GigabitEthernet0/0
 description Lien fournisseur
 ip address 10.20.0.1 255.255.255.252
 ip nat outside
 no shutdown
!
interface GigabitEthernet0/1
 description Reseau utilisateurs
 ip address 172.20.10.2 255.255.255.0
 ip nat inside
 standby version 2
 standby 10 ip 172.20.10.1
 standby 10 priority 120
 standby 10 preempt
 no shutdown
!
interface GigabitEthernet0/2
 description Reseau avec relais DHCP
 ip address 172.20.20.1 255.255.255.0
 ip helper-address 192.0.2.53
 no shutdown
!
interface GigabitEthernet0/3
 description Gestion hors bande (administrativement arrete)
 vrf forwarding ADMIN
 ip address 192.0.2.10 255.255.255.0
 shutdown
!
interface GigabitEthernet0/4
 description Transport 802.1Q
 no ip address
 no shutdown
!
interface GigabitEthernet0/4.100
 description Sous-interface VLAN 100
 encapsulation dot1Q 100
 ip address 172.20.100.1 255.255.255.0
 no shutdown
!
router ospf 20
 router-id 10.20.20.20
 network 10.20.20.20 0.0.0.0 area 0
 network 172.20.0.0 0.0.255.255 area 0
 passive-interface Loopback0
 passive-interface GigabitEthernet0/1
 redistribute connected subnets
!
router bgp 65120
 bgp router-id 10.20.20.20
 neighbor UPSTREAM peer-group
 neighbor UPSTREAM remote-as 65200
 neighbor 10.20.0.2 peer-group UPSTREAM
 address-family ipv4
  network 172.20.10.0 mask 255.255.255.0
  neighbor 10.20.0.2 activate
  neighbor UPSTREAM route-map RM_IN in
 exit-address-family
!
ip route 0.0.0.0 0.0.0.0 10.20.0.2
ip route 198.51.100.0 255.255.255.0 10.20.0.2 210
ip route vrf ADMIN 203.0.113.0 255.255.255.0 GigabitEthernet0/3 192.0.2.1 150
!
ip access-list extended MGMT_SSH
 10 permit tcp host 192.0.2.50 host 192.0.2.10 eq 22
 20 deny ip any any
!
access-list 15 permit 172.20.10.0 0.0.0.255
ip prefix-list PL_IN seq 5 permit 172.20.10.0/24
ip prefix-list PL_IN seq 10 deny 0.0.0.0/0 le 32
route-map RM_IN permit 10
 match ip address prefix-list PL_IN
 set local-preference 180
ip community-list expanded COMMUNITY_ALLOWED permit _65120:
!
vlan 100
 name STAFF
!
ip nat pool WAN_POOL 198.51.100.10 198.51.100.12 prefix-length 28
ip nat inside source list 15 pool WAN_POOL overload
ip nat inside source static tcp 172.20.10.50 443 198.51.100.15 8443
!
ip dhcp excluded-address 172.20.10.1 172.20.10.20
ip dhcp pool STAFF_LAN
 network 172.20.10.0 255.255.255.0
 default-router 172.20.10.1
 dns-server 192.0.2.53 192.0.2.54
 domain-name lab.example.invalid
!
snmp-server community EXAMPLE_RO_ONLY RO 15
snmp-server host 192.0.2.60 version 2c EXAMPLE_RO_ONLY
logging host 192.0.2.61
logging source-interface Loopback0
logging trap warnings
!
username auditreader privilege 15 secret 5 FAKE_HASH_FOR_PARSER_TEST_ONLY
line vty 0 4
 login local
 transport input ssh
 exec-timeout 5 0
!
banner motd ^C
AUTHORIZED LAB USERS ONLY^C
!
end
write memory
